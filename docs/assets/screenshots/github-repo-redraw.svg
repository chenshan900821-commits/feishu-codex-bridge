<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">GitHub repository screenshot redraw</title>
  <desc id="desc">A clean redraw of the GitHub repository quick setup page for chenshan900821-commits/feishu-codex-bridge.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#1d2939" flood-opacity="0.13"/>
    </filter>
    <style>
      .title { font: 700 32px "Segoe UI", Arial, sans-serif; fill:#24292f; }
      .text { font: 500 20px "Segoe UI", Arial, sans-serif; fill:#344054; }
      .code { font: 500 18px "Cascadia Mono", Consolas, monospace; fill:#24292f; }
    </style>
  </defs>
  <rect width="1400" height="780" fill="#f6f8fa"/>
  <rect x="0" y="0" width="1400" height="80" fill="#24292f"/>
  <text x="56" y="50" style="font:700 27px 'Segoe UI',Arial,sans-serif;fill:#fff">GitHub</text>
  <text x="190" y="50" style="font:500 22px 'Segoe UI',Arial,sans-serif;fill:#c9d1d9">chenshan900821-commits / feishu-codex-bridge</text>

  <rect x="70" y="135" width="1260" height="160" rx="12" fill="#ddf4ff" stroke="#80ccff"/>
  <text x="110" y="194" class="title">Quick setup</text>
  <rect x="110" y="220" width="250" height="42" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="132" y="248" class="text">HTTPS</text>
  <rect x="380" y="220" width="850" height="42" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="402" y="248" class="code">https://github.com/chenshan900821-commits/feishu-codex-bridge.git</text>

  <rect x="70" y="350" width="1260" height="330" rx="14" fill="#ffffff" filter="url(#shadow)"/>
  <text x="110" y="410" class="title">Push an existing repository</text>
  <rect x="110" y="445" width="1180" height="190" rx="12" fill="#f6f8fa"/>
  <text x="140" y="492" class="code">git remote add origin https://github.com/chenshan900821-commits/feishu-codex-bridge.git</text>
  <text x="140" y="532" class="code">git branch -M main</text>
  <text x="140" y="572" class="code">git push -u origin main</text>
</svg>
