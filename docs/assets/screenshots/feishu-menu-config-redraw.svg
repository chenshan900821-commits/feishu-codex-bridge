<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1460 920" role="img" aria-labelledby="title desc">
  <title id="title">Feishu Bot menu configuration screenshot redraw</title>
  <desc id="desc">A privacy-safe redraw of the Feishu Open Platform Bot custom menu configuration page, showing push event menu items and event ids.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1f2937" flood-opacity=".10"/>
    </filter>
    <style>
      .ui { font:500 18px "Microsoft YaHei","PingFang SC","Segoe UI",Arial,sans-serif; fill:#172033; }
      .nav { font:600 16px "Microsoft YaHei","PingFang SC","Segoe UI",Arial,sans-serif; fill:#344054; }
      .muted { font:500 15px "Microsoft YaHei","PingFang SC","Segoe UI",Arial,sans-serif; fill:#7b8794; }
      .title { font:800 24px "Microsoft YaHei","PingFang SC","Segoe UI",Arial,sans-serif; fill:#101828; }
      .label { font:700 17px "Microsoft YaHei","PingFang SC","Segoe UI",Arial,sans-serif; fill:#101828; }
      .small { font:500 14px "Microsoft YaHei","PingFang SC","Segoe UI",Arial,sans-serif; fill:#667085; }
      .code { font:700 16px "Cascadia Mono",Consolas,monospace; fill:#1d2939; }
    </style>
  </defs>

  <rect width="1400" height="780" fill="#f7f9fc"/>
  <rect x="0" y="0" width="1400" height="70" fill="#ffffff"/>
  <path d="M0 70 H1400" stroke="#e5e7eb"/>
  <path d="M34 26 l18-18 h30 l-21 21 21 19 h-30z" fill="#3370ff"/>
  <path d="M52 48 l-18-18 18-18 h30 l-22 22 22 14z" fill="#12b886" opacity=".9"/>
  <text x="106" y="43" class="title">飞书开放平台</text>
  <text x="286" y="43" class="ui">客户案例</text>
  <text x="412" y="43" class="ui">应用中心</text>
  <text x="538" y="43" class="ui">开发文档</text>
  <text x="664" y="43" class="ui">智能助手</text>
  <text x="790" y="43" class="ui">更新日志</text>

  <rect x="0" y="70" width="1400" height="84" fill="#ffffff"/>
  <path d="M0 154 H1400" stroke="#e5e7eb"/>
  <rect x="118" y="88" width="52" height="52" rx="14" fill="#e6f0ff"/>
  <circle cx="144" cy="114" r="17" fill="#6aa8ff"/>
  <text x="184" y="111" class="label">cc</text>
  <rect x="214" y="93" width="52" height="24" rx="8" fill="#dcfce7"/>
  <text x="226" y="111" class="small" fill="#15803d">已启用</text>
  <text x="184" y="136" class="small">组织与账号信息已隐藏</text>
  <rect x="424" y="88" width="232" height="52" rx="10" fill="#dcfce7"/>
  <circle cx="454" cy="114" r="10" fill="#22c55e"/>
  <path d="M449 114 l4 4 8-10" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="480" y="121" class="ui">当前修改均已发布</text>

  <rect x="0" y="154" width="370" height="626" fill="#ffffff"/>
  <path d="M370 154 V780" stroke="#e5e7eb"/>
  <text x="34" y="212" class="muted">基础信息</text>
  <text x="72" y="262" class="nav">凭证与基础信息</text>
  <rect x="12" y="290" width="346" height="48" rx="6" fill="#f2f4f7"/>
  <text x="72" y="321" class="nav">协作者管理</text>
  <text x="34" y="396" class="muted">应用能力</text>
  <rect x="12" y="424" width="346" height="50" rx="6" fill="#dce7ff"/>
  <text x="72" y="456" class="nav" fill="#2563eb">机器人</text>
  <text x="34" y="534" class="muted">开发配置</text>
  <text x="72" y="584" class="nav">权限管理</text>
  <text x="72" y="634" class="nav">事件与回调</text>
  <text x="72" y="684" class="nav">安全设置</text>

  <g transform="translate(438 196)">
    <text x="0" y="34" class="title">机器人自定义菜单</text>
    <text x="0" y="78" class="ui">开启机器人菜单能力后，用户可以在机器人的单聊中访问菜单。</text>
    <text x="0" y="126" class="label">菜单配置</text>
    <text x="0" y="160" class="muted">配置将在版本发布成功后生效</text>

    <g transform="translate(0 192)" filter="url(#shadow)">
      <rect x="0" y="0" width="510" height="520" rx="14" fill="#ffffff" stroke="#d0d5dd"/>
      <rect x="0" y="0" width="510" height="60" rx="14" fill="#ffffff"/>
      <text x="218" y="39" class="label">cc</text>
      <rect x="248" y="21" width="48" height="22" rx="7" fill="#fff7ed"/>
      <text x="258" y="38" class="small" fill="#ea580c">机器人</text>
      <circle cx="34" cy="490" r="24" fill="#f8fafc" stroke="#e5e7eb"/>
      <rect x="18" y="474" width="32" height="32" rx="6" fill="#fff" stroke="#98a2b3"/>
      <path d="M26 485 h16 M26 492 h16 M26 499 h10" stroke="#667085" stroke-width="2" stroke-linecap="round"/>
      <rect x="72" y="462" width="132" height="50" rx="10" fill="#ffffff" stroke="#2563eb"/>
      <text x="116" y="494" class="ui" fill="#2563eb">帮助</text>
      <rect x="218" y="462" width="132" height="50" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
      <text x="244" y="484" class="ui">Codex 怎么</text>
      <text x="274" y="506" class="ui">用</text>
      <rect x="364" y="462" width="132" height="50" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
      <text x="396" y="494" class="ui">常用提示词</text>
      <text x="145" y="308" class="muted">当前页面为手机端展示效果</text>
    </g>

    <g transform="translate(544 192)" filter="url(#shadow)">
      <rect x="0" y="0" width="430" height="520" rx="14" fill="#ffffff" stroke="#d0d5dd"/>
      <text x="30" y="48" class="title">主菜单配置</text>
      <text x="30" y="104" class="label">名称</text>
      <rect x="30" y="126" width="360" height="54" rx="8" fill="#ffffff" stroke="#d0d5dd"/>
      <text x="52" y="160" class="ui">帮助</text>
      <text x="30" y="226" class="label">响应动作</text>
      <circle cx="42" cy="264" r="10" fill="#3370ff"/>
      <circle cx="42" cy="264" r="4" fill="#ffffff"/>
      <text x="62" y="270" class="ui">推送事件</text>
      <rect x="30" y="300" width="360" height="54" rx="8" fill="#ffffff" stroke="#d0d5dd"/>
      <text x="52" y="334" class="muted">事件 ID</text>
      <text x="132" y="334" class="code">help</text>

      <rect x="30" y="386" width="360" height="88" rx="10" fill="#f8fafc" stroke="#e5e7eb"/>
      <text x="52" y="421" class="small">其他菜单事件 ID：</text>
      <text x="52" y="450" class="code">codex_guide  examples  dirs  status</text>
    </g>
  </g>

  <rect x="878" y="98" width="328" height="34" rx="17" fill="#eefdf3" stroke="#bbf7d0"/>
  <text x="898" y="121" class="small" fill="#166534">截图已重绘：隐藏组织、账号、头像等信息</text>
</svg>
